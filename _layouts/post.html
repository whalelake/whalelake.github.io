---
layout: default
---

<article class="post">
  <header class="post-header">
    <a class="kicker" href="{{ '/archive/' | relative_url }}">{{ site.category_labels[page.category] | default: page.category }}</a>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt %}
      <p class="deck">{{ page.excerpt }}</p>
    {% endif %}
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
      <span>{{ page.content | number_of_words }} words</span>
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
